[package]
name = "ostrovok-core"
version = "3.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fancy-regex = "0.13"
rand = "0.8"
ureq = { version = "2", features = ["json"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
