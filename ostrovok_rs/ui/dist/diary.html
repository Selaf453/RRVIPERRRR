<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Личный дневник</title>
<style>
:root { --accent:#ff8a3d; --gold:#ffd34d; --dim:#9a9db5; --line:#262a3f; color-scheme:dark; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; background:#101120; color:#f2f3f8; font-family:"Segoe UI",system-ui,sans-serif; }
.btn { font:inherit; font-weight:700; color:inherit; background:#ffffff14; border:0; border-radius:12px; padding:0 16px; min-height:42px; cursor:pointer; } .btn:hover { background:#ffffff26; } .btn.main { background:var(--accent); color:#1c0f05; } .btn.red { background:#f8717126; color:#fca5a5; }
input,textarea { font:inherit; color:#fff; background:#0a0a0d; border:1px solid #2d3150; border-radius:12px; padding:0 12px; min-height:42px; } input:focus,textarea:focus { outline:2px solid var(--gold); outline-offset:1px; }
#lock { height:100%; display:grid; place-items:center; }
.lc { width:380px; background:#171926; border:1px solid var(--line); border-radius:24px; padding:30px 32px; display:flex; flex-direction:column; gap:12px; text-align:center; }
.lc .ic { width:74px; height:74px; border-radius:50%; background:#ffffff12; display:grid; place-items:center; font-size:34px; margin:0 auto; } .lc h1 { margin:0; font-size:22px; } .lc p { margin:0; color:var(--dim); font-size:14px; line-height:1.5; } .err { color:#f87171; font-weight:700; min-height:20px; font-size:14px; }
#ed { display:none; height:100%; } .wrap { display:flex; height:100%; }
.side { width:290px; flex:none; background:#0b0b13; border-right:1px solid var(--line); display:flex; flex-direction:column; padding:14px; gap:10px; }
.side h2 { margin:0; font-size:18px; } .stats { color:var(--dim); font-size:13px; } .side input { width:100%; }
.list { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:6px; margin:0 -4px; padding:0 4px; }
.it { display:flex; gap:10px; align-items:center; padding:9px 10px; border-radius:14px; cursor:pointer; background:#ffffff08; } .it:hover { background:#ffffff12; } .it.on { background:#ff8a3d26; box-shadow:inset 3px 0 0 var(--accent); }
.it .m { font-size:22px; } .it .t { min-width:0; flex:1; } .it .t b { display:block; font-size:14px; } .it .t span { display:block; font-size:12.5px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.en { display:flex; gap:2px; } .en i { width:3px; height:12px; border-radius:2px; background:#ffffff26; } .en i.f { background:var(--accent); }
.pane { flex:1; min-width:0; display:flex; flex-direction:column; padding:20px 26px; gap:12px; }
.top { display:flex; align-items:center; gap:12px; } .top h1 { margin:0; font-size:24px; flex:1; } .top small { color:var(--dim); display:block; font-size:13px; font-weight:500; margin-top:2px; }
.moods { display:flex; gap:8px; flex-wrap:wrap; } .moods button { font:inherit; font-weight:700; color:#c9ccdb; background:#ffffff0d; border:0; border-radius:14px; padding:8px 12px; cursor:pointer; } .moods button.on { box-shadow:inset 0 0 0 2px var(--accent); background:#ff8a3d1f; color:#fff; }
.row { display:flex; gap:12px; align-items:center; } .row input { flex:1; font-size:17px; font-weight:700; }
.energy { display:flex; gap:4px; align-items:center; color:var(--dim); font-size:12px; font-weight:700; } .energy b { width:22px; height:30px; border-radius:6px; background:#ffffff1c; cursor:pointer; } .energy b.f { background:linear-gradient(var(--gold),var(--accent)); }
textarea { flex:1; resize:none; padding:12px 14px; font-size:16px; line-height:1.6; }
.bot { display:flex; align-items:center; gap:12px; } .bot .s { flex:1; color:var(--dim); font-size:13px; }
.empty { color:var(--dim); text-align:center; padding:30px 10px; }
</style></head>
<body>
<div id="lock"><div class="lc"><div class="ic" id="lIc">🔒</div><h1 id="lT">Личный дневник</h1><p id="lS"></p>
  <input type="password" id="p1" placeholder="Пароль" autocomplete="off"><input type="password" id="p2" placeholder="Повтори пароль" autocomplete="off" style="display:none">
  <div class="err" id="err"></div><button class="btn main" id="go">Открыть дневник</button></div></div>
<div id="ed"><div class="wrap">
  <div class="side"><h2>Дневник</h2><div class="stats" id="stats"></div><button class="btn main" id="today">Запись на сегодня</button><input id="search" placeholder="Поиск по записям"><div class="list" id="list"></div><button class="btn" id="lockB">🔒 Закрыть дневник</button></div>
  <div class="pane">
    <div class="top"><h1 id="dTitle"></h1><input type="date" id="dPick"></div>
    <div class="moods" id="moods"></div>
    <div class="row"><input id="hi" placeholder="Главное за день одной строкой" maxlength="120"><div class="energy" id="energy"><span>Энергия</span></div></div>
    <textarea id="body" placeholder="Как прошёл день, что чувствуешь, что запомнилось, что дальше…"></textarea>
    <div class="bot"><span class="s" id="saved"></span><span class="s" id="chars" style="flex:none"></span><button class="btn red" id="del">Удалить запись</button><button class="btn main" id="save">Сохранить · Ctrl+S</button></div>
  </div></div></div>
<script src="common.js"></script>
<script>
"use strict";
const MOODS6 = [["🔥", "Огонь"], ["😊", "Кайф"], ["🖤", "Вайб"], ["😐", "Норм"], ["😴", "Устал"], ["😔", "Грустно"]];
const MONTHS = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"], DAYS = ["понедельник", "вторник", "среда", "четверг", "пятница", "суббота", "воскресенье"];
const iso = d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
let cur = iso(new Date()), mood = "😊", level = 3, dirty = false, timer = 0, items = [];
const title = s => { const d = new Date(s + "T00:00:00"), t = new Date(), y = new Date(); y.setDate(t.getDate() - 1); return iso(d) === iso(t) ? "Сегодня" : iso(d) === iso(y) ? "Вчера" : d.getDate() + " " + MONTHS[d.getMonth()]; };
const sub = s => { const d = new Date(s + "T00:00:00"); return DAYS[(d.getDay() + 6) % 7] + ", " + d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear(); };

async function initLock() {
  const st = await T.invoke("diary_state"); $("lock").style.display = "grid"; $("ed").style.display = "none"; $("err").textContent = ""; $("p1").value = ""; $("p2").value = "";
  const has = st && st.has_pwd; $("p2").style.display = has ? "none" : ""; $("lIc").textContent = has ? "🔒" : "🔐"; $("lT").textContent = has ? "Личный дневник" : "Создай пароль";
  $("lS").textContent = has ? "Введи пароль, чтобы открыть записи." : "Придумай пароль, который знаешь только ты. Минимум 3 символа."; $("go").textContent = has ? "Открыть дневник" : "Создать пароль и войти"; $("p1").focus();
  if (st && st.open) openEditor();
}
async function auth() { try { await T.invoke("diary_auth", { pwd: $("p1").value, pwd2: $("p2").value }); openEditor(); } catch (e) { $("err").textContent = String(e); $("p1").select(); } }
$("go").addEventListener("click", auth); ["p1", "p2"].forEach(i => $(i).addEventListener("keydown", e => { if (e.key === "Enter") auth(); }));
async function openEditor() { $("lock").style.display = "none"; $("ed").style.display = "block"; await load(cur); await refresh(); }

function paintMoods() { const b = $("moods"); b.textContent = ""; MOODS6.forEach(([e, t]) => { const x = el("button", mood === e ? "on" : "", e + " " + t); x.addEventListener("click", () => { mood = e; dirty = true; paintMoods(); queue(); }); b.append(x); }); }
function paintEnergy() { const b = $("energy"); [...b.querySelectorAll("b")].forEach(x => x.remove()); for (let i = 1; i <= 5; i++) { const x = el("b", i <= level ? "f" : ""); x.addEventListener("click", () => { level = i; dirty = true; paintEnergy(); queue(); }); b.append(x); } }
async function load(d) {
  cur = d; const e = await T.invoke("diary_get", { date: d }); mood = e.mood || "😊"; level = 5 - (e.energy ?? 2); $("hi").value = e.highlight || ""; $("body").value = e.text || ""; dirty = false;
  $("dTitle").textContent = ""; $("dTitle").append(title(d)); const s = el("small", "", sub(d)); $("dTitle").append(s); $("dPick").value = d; paintMoods(); paintEnergy(); chars(); $("saved").textContent = "";
}
async function refresh() {
  const r = await T.invoke("diary_list"); items = r.items; const q = $("search").value.trim().toLowerCase(), box = $("list"); box.textContent = "";
  $("stats").textContent = items.length + " записей" + (r.streak ? " · серия " + r.streak + " дн. 🔥" : "");
  const shown = items.filter(x => !q || (x.date + " " + x.highlight + " " + x.text).toLowerCase().includes(q));
  if (!shown.length) box.append(el("div", "empty", q ? "Ничего не найдено" : "Записей пока нет"));
  shown.forEach(x => { const r = el("div", "it" + (x.date === cur ? " on" : "")), t = el("div", "t"); t.append(el("b", "", title(x.date)), el("span", "", x.highlight || (x.text || "").split("\n")[0] || "Пусто"));
    const en = el("div", "en"); for (let i = 1; i <= 5; i++) en.append(el("i", i <= 5 - (x.energy ?? 2) ? "f" : "")); r.append(el("div", "m", x.mood || "📝"), t, en);
    r.addEventListener("click", async () => { await flush(); await load(x.date); refresh(); }); box.append(r); });
}
async function flush() { if (dirty) await save(false); }
async function save(manual) {
  clearTimeout(timer); try { await T.invoke("diary_save", { date: cur, mood, highlight: $("hi").value, text: $("body").value, energy: Math.max(0, Math.min(4, 5 - level)) }); dirty = false; $("saved").textContent = manual ? "Сохранено ✓" : "Автосохранено"; refresh(); } catch (e) { $("saved").textContent = String(e); }
}
const queue = () => { clearTimeout(timer); timer = setTimeout(() => save(false), 1200); };
const chars = () => { $("chars").textContent = $("body").value.length + " симв."; };
["hi", "body"].forEach(i => $(i).addEventListener("input", () => { dirty = true; chars(); queue(); }));
$("save").addEventListener("click", () => save(true)); addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(true); } });
$("del").addEventListener("click", async () => { if (!confirm("Удалить запись за этот день?")) return; await T.invoke("diary_delete", { date: cur }); await load(cur); refresh(); });
$("today").addEventListener("click", async () => { await flush(); await load(iso(new Date())); refresh(); });
$("dPick").addEventListener("change", async e => { if (!e.target.value) return; await flush(); await load(e.target.value); refresh(); });
$("search").addEventListener("input", refresh);
$("lockB").addEventListener("click", async () => { await flush(); await T.invoke("diary_lock"); initLock(); });
initLock();
</script></body></html>
