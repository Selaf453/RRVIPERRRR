<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Островок: настройки</title>
<style>
:root { --ink:#0a0a0d; --gold:#ffd34d; --accent:#ff8a3d; --dim:#9a9db5; --line:#262a3f; color-scheme:dark; }
* { box-sizing:border-box; }
html,body { margin:0; height:100%; background:#101120; color:#f2f3f8; font-family:"Segoe UI",system-ui,sans-serif; }
.app { display:flex; height:100%; }
.side { width:220px; flex:none; background:#0b0b13; border-right:1px solid var(--line); padding:16px 10px; display:flex; flex-direction:column; gap:4px; }
.side h1 { margin:4px 10px 14px; font-size:18px; display:flex; align-items:center; gap:8px; }
.nav { font:inherit; font-weight:700; text-align:left; color:#c9ccdb; background:none; border:0; border-radius:12px; padding:0 12px; min-height:42px; cursor:pointer; }
.nav:hover { background:#ffffff0d; } .nav.on { background:#ff8a3d26; color:#fff; box-shadow:inset 3px 0 0 var(--accent); }
.side .ver { margin-top:auto; font-size:12px; color:var(--dim); padding:0 10px; }
main { flex:1; overflow-y:auto; padding:22px 28px 40px; }
main h2 { margin:0 0 4px; font-size:24px; } main .sub { color:var(--dim); margin:0 0 18px; font-size:14px; }
.card { background:#171926; border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:14px; max-width:760px; }
.card h3 { margin:0 0 10px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
.row { display:flex; align-items:center; gap:14px; padding:9px 0; border-top:1px solid #ffffff0d; } .row:first-of-type { border-top:0; }
.row .l { flex:1; min-width:0; } .row .l b { display:block; font-size:15px; } .row .l span { font-size:12.5px; color:var(--dim); }
.sw { width:50px; height:28px; border-radius:14px; background:#ffffff26; position:relative; flex:none; border:0; cursor:pointer; padding:0; } .sw::after { content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:left .2s; } .sw.on { background:var(--accent); } .sw.on::after { left:25px; }
input[type=text],input[type=number],input[type=date],input[type=password] { font:inherit; color:#fff; background:#0a0a0d; border:1px solid #2d3150; border-radius:12px; padding:0 12px; min-height:42px; } input:focus { outline:2px solid var(--gold); outline-offset:1px; }
input[type=number] { width:90px; text-align:center; } input.w { width:100%; }
input[type=range] { width:200px; accent-color:var(--accent); }
.btn { font:inherit; font-weight:700; color:inherit; background:#ffffff14; border:0; border-radius:12px; padding:0 16px; min-height:42px; cursor:pointer; } .btn:hover { background:#ffffff26; } .btn.main { background:var(--accent); color:#1c0f05; } .btn.red { background:#f8717126; color:#fca5a5; }
.btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.styles { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; } .styles button { font:inherit; font-weight:700; color:#c9ccdb; background:#ffffff0d; border:0; border-radius:14px; min-height:84px; cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; } .styles button.on { box-shadow:inset 0 0 0 2px var(--accent); background:#ff8a3d1f; color:#fff; }
.styles i { width:62px; height:20px; background:#000; border:1px solid #ffffff33; border-radius:10px; } .styles i.rounded { border-radius:6px } .styles i.notch { border-radius:0 0 10px 10px; border-top:0 } .styles i.glass { background:#586080aa; border-color:#fffa } .styles i.neon { border-color:#ff8a3d; box-shadow:0 0 8px #ff8a3d }
.code { font:700 20px ui-monospace,Consolas,monospace; letter-spacing:.08em; color:var(--gold); background:#0a0a0d; border-radius:12px; padding:10px 14px; display:inline-block; user-select:all; }
.hint { font-size:13px; color:var(--dim); line-height:1.55; margin:8px 0 0; }
.steps { margin:0; padding-left:20px; color:#d9dbe8; line-height:1.8; font-size:14px; }
.ok { color:#86efac; font-weight:700; } .err { color:#fca5a5; font-weight:700; }
/* домашка */
.hwform { display:grid; grid-template-columns:1fr auto; gap:10px; }
.hw { display:flex; align-items:center; gap:12px; background:#ffffff0a; border:1px solid #ffffff10; border-radius:16px; padding:10px 10px 10px 8px; margin-top:8px; }
.hw .bar { width:5px; align-self:stretch; border-radius:3px; flex:none; }
.hw .m { flex:1; min-width:0; } .hw .m b { font-size:14px; } .hw .m div { font-size:14.5px; margin-top:2px; overflow-wrap:anywhere; color:#eceef8; }
.pill { font-size:12px; font-weight:800; padding:5px 10px; border-radius:20px; background:#ffffff1f; flex:none; } .pill.today { background:#fb923c33; color:#fdba74; } .pill.late { background:#f8717133; color:#fca5a5; }
.hw .a { width:40px; min-height:40px; padding:0; border:0; border-radius:12px; cursor:pointer; font-size:17px; flex:none; } .hw .a.ok { background:#4ade8026; color:#86efac; } .hw .a.del { background:none; color:var(--dim); } .hw .a.del:hover { background:#f8717126; color:#fca5a5; }
.hw.done { opacity:.5; } .hw.done .m div { text-decoration:line-through; }
.sech { font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); margin:16px 2px 4px; }
.empty { text-align:center; color:var(--dim); padding:22px; line-height:1.6; }
.ex { display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid #ffffff0d; } .ex .n { flex:1; } .ex .n b { display:block; } .ex .n span { font-size:12.5px; color:var(--dim); } .ex .big { font-size:22px; font-weight:800; color:var(--gold); min-width:80px; text-align:right; }
</style></head>
<body><div class="app"><nav class="side" id="side"></nav><main id="main"></main></div>
<script src="common.js"></script><script src="mood.js"></script><script src="settings.js"></script></body></html>
